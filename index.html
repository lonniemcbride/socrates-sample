<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="logo">S</div>
                <div class="header-text">
                    <h1>Senator</h1>
                    <p>Counter-arguments backed by primary sources</p>
                </div>
            </div>
            <div class="header-status" id="statusDot">
                <span class="dot"></span>
                <span class="status-text">Ready</span>
            </div>
        </header>

        <main class="chat" id="chatContainer">
            <div class="message senator">
                <div class="msg-body">
                    <p>Make a claim. I'll build the strongest case against it using peer-reviewed research and government publications.</p>
                </div>
            </div>
        </main>

        <footer class="input-bar">
            <form id="inputForm" class="input-form">
                <textarea id="userInput" placeholder="State your position..." rows="1" autofocus></textarea>
                <button type="submit" id="sendBtn" aria-label="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
