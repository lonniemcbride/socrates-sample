<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-group">
        <div class="logo">S</div>
        <h1 class="app-title">Senator</h1>
      </div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Ready</span>
      </div>
    </header>

    <main id="chatContainer" class="chat-container">
      <div class="welcome-message">
        <h2>Welcome to Senator</h2>
        <p>Make a claim or share a link, and I'll find well-sourced counter-arguments. I search academic databases to give you a fuller picture of any topic.</p>
        <p class="welcome-hint">Try something like: "Remote work decreases productivity" or paste an article URL.</p>
      </div>
    </main>

    <footer class="app-footer">
      <div class="footer-nav">
        <a href="debate.html" class="arena-link">Debate Arena &rarr;</a>
      </div>
      <form id="inputForm" class="input-form">
        <textarea id="userInput" placeholder="Make a claim or paste a URL..." rows="1"></textarea>
        <button type="submit" id="sendBtn" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
